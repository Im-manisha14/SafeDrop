services:
  - type: web
    name: safedrop-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: safedrop-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: SHARE_TOKEN_SECRET
        sync: false
      - key: UPLOAD_FOLDER
        value: /app/uploads
      - key: MAX_CONTENT_LENGTH
        value: "10485760"
      - key: FRONTEND_ORIGIN
        value: https://safedrop-frontend.onrender.com
      - key: FLASK_DEBUG
        value: "0"
    healthCheckPath: /api/health

  - type: static
    name: safedrop-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://safedrop-api.onrender.com

databases:
  - name: safedrop-db
    databaseName: safedrop
    user: safedrop_user
    plan: free
